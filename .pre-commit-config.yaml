# El portero: corre estos verificadores antes de cada commit.
# Activar una vez por proyecto: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -q]
        additional_dependencies: ["bandit[toml]"]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1
    hooks:
      - id: pip-audit
        args: [-r, requirements.txt]

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        # Usa el entorno del proyecto (.venv), que tiene las librerías del script del relieve.
        # Crearlo: ver "Entorno de Python del proyecto" en el README.
        entry: .venv/bin/pytest -q
        language: system
        pass_filenames: false
        always_run: true
